name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs previas si se pushea un nuevo commit a la misma rama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: angular

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm tiene que instalarse ANTES de setup-node porque el cache de
      # setup-node necesita encontrar el binario de pnpm para resolver el
      # store path.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: angular/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Genera environment.ts con valores demo. Los secrets reales NO se
      # exponen en CI: la build verifica que compila, no que deploya.
      - name: Generate environment.ts (CI fixture)
        run: pnpm run set-env
        env:
          NG_APP_FIREBASE_API_KEY: ci-fixture
          NG_APP_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NG_APP_FIREBASE_PROJECT_ID: ci-project
          NG_APP_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NG_APP_FIREBASE_MESSAGING_SENDER_ID: '0'
          NG_APP_FIREBASE_APP_ID: '0:0:web:0'

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: angular/coverage
          retention-days: 7
