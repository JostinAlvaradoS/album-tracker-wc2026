name: Deploy preview to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: angular/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: angular
        run: pnpm install --frozen-lockfile

      - name: Generate angular/.env from secrets
        working-directory: angular
        env:
          NG_APP_FIREBASE_API_KEY: ${{ secrets.NG_APP_FIREBASE_API_KEY }}
          NG_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.NG_APP_FIREBASE_AUTH_DOMAIN }}
          NG_APP_FIREBASE_PROJECT_ID: ${{ secrets.NG_APP_FIREBASE_PROJECT_ID }}
          NG_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.NG_APP_FIREBASE_STORAGE_BUCKET }}
          NG_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NG_APP_FIREBASE_MESSAGING_SENDER_ID }}
          NG_APP_FIREBASE_APP_ID: ${{ secrets.NG_APP_FIREBASE_APP_ID }}
        run: |
          {
            echo "NG_APP_FIREBASE_API_KEY=${NG_APP_FIREBASE_API_KEY}"
            echo "NG_APP_FIREBASE_AUTH_DOMAIN=${NG_APP_FIREBASE_AUTH_DOMAIN}"
            echo "NG_APP_FIREBASE_PROJECT_ID=${NG_APP_FIREBASE_PROJECT_ID}"
            echo "NG_APP_FIREBASE_STORAGE_BUCKET=${NG_APP_FIREBASE_STORAGE_BUCKET}"
            echo "NG_APP_FIREBASE_MESSAGING_SENDER_ID=${NG_APP_FIREBASE_MESSAGING_SENDER_ID}"
            echo "NG_APP_FIREBASE_APP_ID=${NG_APP_FIREBASE_APP_ID}"
          } > .env

      - name: Build Angular app
        working-directory: angular
        run: pnpm run build

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALBUM_MUNDIAL_ADMINISTRATION }}
          projectId: album-mundial-administration
          expires: 7d
